<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naira Ads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0e14;color:#fff;padding-bottom:90px}
.card{margin:15px;background:#151c26;border-radius:18px;padding:18px;border:1px solid #1f2a38}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}
.balance{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#0a0e14;border-radius:24px;padding:22px;margin:15px;position:relative;overflow:hidden}
</style>
</head>
<body>

<div style="padding:20px;display:flex;justify-content:space-between">
  <b id="username">👋 Welcome Boss</b>
  <span style="background:#1c2530;padding:6px 12px;border-radius:20px;font-size:12px">🔥 <span id="adsCount">0</span> Ads</span>
</div>

<div class="balance">
  <div style="font-size:12px;opacity:0.7;font-weight:700">TOTAL BALANCE</div>
  <div style="font-size:36px;font-weight:900;margin-top:5px">₦<span id="balance">0</span></div>
  <div style="font-size:12px;margin-top:5px;background:rgba(0,0,0,0.15);display:inline-block;padding:4px 10px;border-radius:20px">≈ $<span id="usd">0.00</span> • Unit 48566 Active</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px">
  <div class="card" style="margin:0;text-align:center;padding:12px"><div>🎬</div><b id="statAds">0</b><div style="font-size:11px;opacity:0.6">Watched</div></div>
  <div class="card" style="margin:0;text-align:center;padding:12px"><div>💵</div><b>₦<span id="statEarn">0</span></b><div style="font-size:11px;opacity:0.6">Today</div></div>
  <div class="card" style="margin:0;text-align:center;padding:12px"><div>👥</div><b>0</b><div style="font-size:11px;opacity:0.6">Referrals</div></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>Watch & Earn</h3><span style="background:#00ff8820;color:#00ff88;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700">+₦10 / Ad</span></div>
  <button id="watchBtn" class="btn" style="background:linear-gradient(135deg,#00ff88,#00cc6a);color:#0a0e14" onclick="showAd()">▶️ WATCH AD - EARN ₦10</button>
  <div style="font-size:11px;opacity:0.5;text-align:center;margin-top:10px">Block int-48566 • Real USD Earning</div>
</div>

<div class="card">
  <h3 style="margin-bottom:10px">👥 Refer & Earn ₦100</h3>
  <p style="font-size:12px;opacity:0.7;margin-bottom:8px">Share link & earn 10% of friends earning</p>
  <div style="background:#0a0e14;padding:10px;border-radius:10px;font-size:11px;word-break:break-all" id="refLink">https://t.me/First_Naira_ads_bot/app</div>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#0f141e;border-top:1px solid #1f2a38;display:flex;justify-content:space-around;padding:10px 0 20px">
  <div style="text-align:center;color:#00ff88"><div>🏠</div><div style="font-size:10px">Home</div></div>
  <div style="text-align:center;opacity:0.5"><div>💳</div><div style="font-size:10px">Withdraw</div></div>
  <div style="text-align:center;opacity:0.5"><div>🏆</div><div style="font-size:10px">Top</div></div>
</div>

<script>
let balance = parseInt(localStorage.getItem('bal')||'0')
let ads = parseInt(localStorage.getItem('ads')||'0')
let cooldown = 0
const tg = window.Telegram?.WebApp

if(tg){tg.ready();tg.expand(); if(tg.initDataUnsafe?.user){document.getElementById('username').innerText='👋 '+tg.initDataUnsafe.user.first_name; document.getElementById('refLink').innerText='https://t.me/First_Naira_ads_bot/app?startapp=ref_'+tg.initDataUnsafe.user.id}}

function updateUI(){
  document.getElementById('balance').innerText=balance.toLocaleString()
  document.getElementById('usd').innerText=(balance/1550).toFixed(3)
  document.getElementById('adsCount').innerText=ads
  document.getElementById('statAds').innerText=ads
  document.getElementById('statEarn').innerText=ads*10
  localStorage.setItem('bal',balance)
  localStorage.setItem('ads',ads)
}
updateUI()

async function showAd(){
  if(cooldown>0)return
  const btn=document.getElementById('watchBtn')
  btn.innerText='Loading Ad...'
  btn.disabled=true
  try{
    const AdController = window.Adsgram.init({ blockId: "int-48566" })
    const result = await AdController.show()
    if(result.done){
      balance+=10; ads++; cooldown=15; updateUI()
      alert('✅ You earned ₦10!')
      let c=15
      const timer=setInterval(()=>{c--;btn.innerText=`Wait ${c}s`;if(c<=0){clearInterval(timer);btn.innerText='▶️ WATCH AD - EARN ₦10';btn.disabled=false;cooldown=0}},1000)
    }else{btn.innerText='▶️ WATCH AD - EARN ₦10';btn.disabled=false;alert('Ad not ready, try again')}
  }catch(e){btn.innerText='▶️ WATCH AD - EARN ₦10';btn.disabled=false;alert('No ads now, try later')}
}
</script>
</body>
</html>
